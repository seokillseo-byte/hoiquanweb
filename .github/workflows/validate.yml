name: Validate website and API
on:
  push:
    branches: [main, feat/better-auth-worker-d1-integration, feat/hoiquanweb-public-site-v1, feat/customer-project-portal, feat/seo-clean-article-routes, feat/public-ui-factual-content-accessibility, feat/admin-dashboard-ux, feat/portal-session-ux, docs/staging-deploy-safety]
  pull_request:
    branches: [main, feat/better-auth-worker-d1-integration, docs/phase-0-master-blueprint-risk-review, feat/seo-clean-article-routes, feat/public-ui-factual-content-accessibility, feat/admin-dashboard-ux, feat/portal-session-ux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate existing website and API scaffold
        run: python scripts/validate_project.py
      - name: Validate staging deployment safety
        run: python scripts/validate_staging_config.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test public content API and authentication boundaries
        run: npm run test:api
      - name: Test clean-slug article prerendering and indexation policy
        run: npm run test:seo
      - name: Test Better Auth against local Worker and D1
        run: npm run test:auth
      - name: Typecheck frontend application
        run: npm run typecheck
      - name: Build frontend application
        run: npm run build
      - name: Generate bilingual public website
        run: node scripts/build_public_site.mjs
      - name: Validate generated public website
        run: node scripts/validate_public_site.mjs
