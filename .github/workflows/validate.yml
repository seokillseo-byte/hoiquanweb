name: Validate website and API
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate existing website and API scaffold
        run: python scripts/validate_project.py
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck frontend application
        run: npm run typecheck
      - name: Build frontend application
        run: npm run build
